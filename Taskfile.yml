version: "3"

tasks:
  deps:
    desc: "Download dependencies"
    cmds:
      - go mod download
      - go mod tidy

  build-cli:
    desc: "Build the tunnelR CLI application"
    deps: [deps]
    cmds:
      - mkdir -p bin
      - go build -o bin/tunnelr-cli ./cmd/cli/main.go

  build-api:
    desc: "Build the tunnelR API server"
    deps: [deps]
    cmds:
      - mkdir -p bin
      - go build -o bin/tunnelr-api ./cmd/api/main.go

  build:
    desc: "Build both CLI and API applications"
    deps: [build-cli, build-api]

  run-cli:
    desc: "Run the tunnelR CLI application"
    cmds:
      - go run ./cmd/cli/main.go

  run-api:
    desc: "Run the tunnelR API server"
    cmds:
      - go run ./cmd/api/main.go

  test:
    desc: "Run all tests"
    cmds:
      - go test ./...

  lint:
    desc: "Run linter"
    cmds:
      - golangci-lint run

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  format:
    desc: "Format code"
    cmds:
      - go fmt ./...

  check:
    desc: "Run all checks (format, lint, vet, test)"
    cmds:
      - task: test
      - task: lint
      - task: vet
      - task: format

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf bin/

  encrypt:
    desc: "Encrypt .env files"
    cmds:
      - bash ./scripts/encrypt.sh

  decrypt:
    desc: "Decrypt .env files"
    cmds:
      - bash ./scripts/decrypt.sh

  default:
    desc: "Show available tasks"
    cmds:
      - task --list
