version: "3"

tasks:
  deps:
    desc: "Download dependencies"
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: "Build the tunnelR CLI application"
    cmds:
      - go build -o bin/tunnelr ./cmd/main.go

  run:
    desc: "Run the tunnelR CLI application"
    cmds:
      - go run ./cmd/main.go --help

  test:
    desc: "Run all tests"
    cmds:
      - go test ./...


  lint:
    desc: "Run linter"
    cmds:
      - golangci-lint run

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  format:
    desc: "Format code"
    cmds:
      - go fmt ./...

  check:
    desc: "Run all checks (format, lint, vet, test)"
    cmds:
      - task: test
      - task: lint
      - task: vet
      - task: format

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf bin/

  default:
    desc: "Show available tasks"
    cmds:
      - task --list
